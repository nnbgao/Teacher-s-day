  <style>
    .falling-petal {
      position: fixed;
      top: -10vh;
      background: linear-gradient(to bottom right, #ffc0cb, #ff69b4); /* Màu cánh hoa hồng phấn */
      width: 15px;
      height: 15px;
      border-radius: 100% 0% 100% 0%; /* Hình dáng cánh hoa */
      opacity: 0.8;
      z-index: 2000; /* Nằm trên cùng */
      box-shadow: 0 0 10px rgba(255, 192, 203, 0.5); /* Hiệu ứng phát sáng nhẹ */
      animation: falling linear forwards;
      pointer-events: none; /* Không che chắn chuột khi click */
    }

    @keyframes falling {
      0% {
        top: -10vh;
        transform: translateX(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        top: 110vh; /* Rơi xuống đáy màn hình */
        transform: translateX(100px) rotate(720deg); /* Vừa rơi vừa xoay và bay ngang */
        opacity: 0;
      }
    }
  </style>

  <script>
    // 1. Phát nhạc khi click
    window.addEventListener('click', function() {
        var audio = document.getElementById("myAudio");
        if (audio) {
            audio.play().catch(error => console.log("Không thể phát nhạc:", error));
        }
    });

    // 2. Tạo hiệu ứng hoa rơi
    function createPetal() {
      const petal = document.createElement('div');
      petal.classList.add('falling-petal');
      
      // Random vị trí xuất hiện (0% tới 100% chiều rộng màn hình)
      petal.style.left = Math.random() * 100 + 'vw';
      
      // Random tốc độ rơi (từ 2s đến 5s)
      const duration = Math.random() * 3 + 2; 
      petal.style.animationDuration = duration + 's';
      
      // Random kích thước hoa (nhỏ to khác nhau một chút)
      const size = Math.random() * 10 + 10; // 10px đến 20px
      petal.style.width = size + 'px';
      petal.style.height = size + 'px';

      document.body.appendChild(petal);

      // Xóa cánh hoa sau khi rơi xong để nhẹ máy (6 giây sau)
      setTimeout(() => {
        petal.remove();
      }, 6000);
    }

    // Cứ 0.3 giây tạo ra một cánh hoa mới
    setInterval(createPetal, 300);

  </script>
