<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flowers for Teachers</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .falling-petal {
      position: fixed;
      top: -10vh;
      background: linear-gradient(to bottom right, #ffc0cb, #ff69b4);
      width: 15px;
      height: 15px;
      border-radius: 100% 0% 100% 0%;
      opacity: 0.8;
      z-index: 2000;
      box-shadow: 0 0 10px rgba(255, 192, 203, 0.5);
      animation: falling linear forwards;
      pointer-events: none;
    }
    @keyframes falling {
      0% { top: -10vh; transform: translateX(0) rotate(0deg); opacity: 1; }
      100% { top: 110vh; transform: translateX(100px) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body class="not-loaded">

<audio id="myAudio" loop>
  <source src="1.mp3" type="audio/mpeg">
</audio>

<div class="night"></div>
<div class="flowers">
  <!-- content omitted for brevity, same as original user file -->
</div>

<div class="message">Chúc mừng Ngày Nhà Giáo Việt Nam 20/11</div>

<script>
    document.addEventListener("click", function () {
        document.body.classList.remove("not-loaded");

        var audio = document.getElementById("myAudio");
        audio.play().catch(() => {});

        startPetals();
    }, { once: true });

    function createPetal() {
      const petal = document.createElement('div');
      petal.classList.add('falling-petal');
      petal.style.left = Math.random() * 100 + 'vw';
      const duration = Math.random() * 3 + 2;
      petal.style.animationDuration = duration + 's';
      const size = Math.random() * 10 + 10;
      petal.style.width = size + 'px';
      petal.style.height = size + 'px';
      document.body.appendChild(petal);
      setTimeout(() => petal.remove(), 6000);
    }

    let petalInterval;
    function startPetals() {
        petalInterval = setInterval(createPetal, 300);
    }
</script>

</body>
</html>
